name: Candidate to Staging

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "ml/**"
      - ".github/workflows/train_register_deploy_staging.yml"

jobs:
  train_register:
    runs-on: ubuntu-latest
    outputs:
      result_json: ${{ steps.train.outputs.result_json }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML deps
        run: pip install -r ml/requirements.txt

      - name: Train + register in MLflow
        id: train
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.DAGSHUB_MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_NAME: churn-model
          DATA_VERSION: "dvc:v1"
        run: |
          python ml/train_and_register.py | tee train_out.json
          echo "result_json=$(cat train_out.json)" >> "$GITHUB_OUTPUT"

      - name: Evaluate gate
        env:
          ACCURACY_THRESHOLD: "0.70"
        run: |
          echo '${{ steps.train.outputs.result_json }}' | python ml/evaluate.py

      - name: Transition model version to Staging + add tag
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.DAGSHUB_MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_NAME: churn-model
        run: |
          pip install mlflow==2.14.3
          python - << 'PY'
          import os, json, mlflow
          from mlflow.tracking import MlflowClient

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          token = os.environ["MLFLOW_TRACKING_TOKEN"]
          os.environ["MLFLOW_TRACKING_USERNAME"] = token
          os.environ["MLFLOW_TRACKING_PASSWORD"] = token

          with open("train_out.json", "r") as f:
              data = json.load(f)

          version = str(data["model_version"])
          name = os.environ["MODEL_NAME"]

          client = MlflowClient()

          # Set stage to Staging 
          client.transition_model_version_stage(
              name=name,
              version=version,
              stage="Staging",
              archive_existing_versions=False
          )

          # Add tag
          client.set_model_version_tag(name=name, version=version, key="deployment", value="staging")

          print(f"Set {name} v{version} to Staging and tagged deployment=staging")
          PY


  deploy_staging:
    needs: train_register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + push backend image (staging)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build -t "$DOCKERHUB_USERNAME/churn-backend:staging" backend
          docker push "$DOCKERHUB_USERNAME/churn-backend:staging"

      - name: Deploy to staging (placeholder)
        run: |
          echo "Deploy placeholder: on a real staging server, run docker compose pulling churn-backend:staging"

  staging_smoke_test:
    needs: deploy_staging
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test placeholder
        run: |
          echo "Smoke test placeholder: curl staging /health and /predict here"
